<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#183524"><meta name="description" content="Imperio Maderero 3D, construye y administra tu aserradero.">
<title>Imperio Maderero 3D: Idle Tycoon</title>
<style>
:root{color-scheme:dark;--gold:#ffd166;--panel:#14291f;--green:#75b84c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bc6d4;color:#fff;font-family:system-ui,Arial;touch-action:none}#world{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.brand,.stat,.bottom{background:#10251be8;border:1px solid #ffffff28;border-radius:14px;padding:10px 13px;box-shadow:0 4px 18px #0005}.brand b{display:block;color:var(--gold)}.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.stat{text-align:center;min-width:68px}.stat b{display:block;color:var(--gold);font-size:17px}.stat small{font-size:10px;opacity:.8}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:auto}.help{font-size:12px;max-width:300px;line-height:1.4}.buttons{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}button{border:0;border-radius:11px;padding:12px 14px;background:var(--gold);color:#30230b;font-weight:800;cursor:pointer}button.alt{background:#315c3d;color:#fff;border:1px solid #ffffff30}button:disabled{opacity:.45}#toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:#101c16ee;border:1px solid #ffffff30;border-radius:12px;padding:10px 15px;opacity:0;transition:opacity .2s;z-index:5;pointer-events:none;text-align:center}#modal{display:none;position:fixed;inset:0;background:#0009;z-index:6;align-items:center;justify-content:center;padding:16px}#modal.show{display:flex}.shop{width:min(520px,100%);max-height:85vh;overflow:auto;background:#14291f;border:1px solid #ffffff35;border-radius:18px;padding:18px}.shop h2{margin:0 0 5px;color:var(--gold)}.shop p{opacity:.75;margin:0 0 12px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #ffffff20;padding:12px 0}.item small{display:block;opacity:.7}.item button{white-space:nowrap}#stickzone{position:fixed;left:18px;bottom:85px;width:116px;height:116px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55;display:none;touch-action:none}#stick{position:absolute;left:35px;top:35px;width:42px;height:42px;border-radius:50%;background:#ffd166;box-shadow:0 3px 12px #0007}@media(max-width:700px){#stickzone{display:block}.stat{min-width:60px;padding:7px}.stat b{font-size:14px}.brand{font-size:13px}.help{max-width:155px}.bottom{align-items:flex-end}.buttons button{padding:11px 10px;font-size:12px}}
</style>
</head>
<body>
<div id="world"></div><div class="hud"><div class="top"><div class="brand"><b>🌲 IMPERIO MADERERO</b><small>Idle Tycoon · Construye tu imperio</small></div><div class="stats"><div class="stat"><b id="cash">$0</b><small>DINERO</small></div><div class="stat"><b id="logs">0/5</b><small>TRONCOS</small></div><div class="stat"><b id="planks">0</b><small>TABLAS</small></div><div class="stat"><b id="crew">0</b><small>LEÑADORES</small></div></div></div><div class="bottom"><div class="help" id="help">Muévete con WASD, flechas o joystick. Acércate a un árbol y mantén TALAR. Lleva troncos al aserradero y vende las tablas.</div><div class="buttons"><button id="chop">🪓 TALAR</button><button class="alt" id="deliver">📦 ENTREGAR</button><button class="alt" id="sell">💰 VENDER</button><button class="alt" id="shopOpen">MEJORAS</button></div></div></div><div id="stickzone"><div id="stick"></div></div><div id="toast"></div><div id="modal"><div class="shop"><h2>🏗️ Mejoras del imperio</h2><p>Reinvierte tus ganancias para producir más.</p><div id="items"></div><button class="alt" id="close" style="width:100%;margin-top:12px">CERRAR</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='imperio_maderero_save_v1';
const defaults={cash:0,logs:0,capacity:5,planks:0,crew:0,axe:1,plankPrice:12,levels:{capacity:0,axe:0,value:0,worker:0}};
let s;try{s={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')};s.levels={...defaults.levels,...(s.levels||{})}}catch{s={...defaults,levels:{...defaults.levels}}}
let scene,camera,renderer,clock,player,trees=[],stickMove={x:0,z:0},keys={},holding=false,chopClock=0,toastClock=0,production=[],workerObjects=[];
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});
const M={grass:material('#54844b'),bark:material('#80502d'),leaf:material('#2e713e'),leaf2:material('#4c963e'),wood:material('#c58a4c'),plank:material('#d6ad70'),dark:material('#273a2d'),shirt:material('#e2b34a'),skin:material('#d99b70'),roof:material('#914a31'),metal:material('#738486')};
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toastClock);toastClock=setTimeout(()=>$('toast').style.opacity=0,1800)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function ui(){$('cash').textContent='$'+Math.floor(s.cash).toLocaleString('es-MX');$('logs').textContent=s.logs+'/'+s.capacity;$('planks').textContent=s.planks;$('crew').textContent=s.crew}
function box(w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function cylinder(r1,r2,h,m,x,y,z,n=8){let o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,n),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
function tree(x,z){let g=new THREE.Group();let t=new THREE.Mesh(new THREE.CylinderGeometry(.22,.29,1.9,8),M.bark);t.position.y=.95;t.castShadow=true;g.add(t);for(let i=0;i<3;i++){let c=new THREE.Mesh(new THREE.ConeGeometry(1.05-i*.18,1.55,8),i===1?M.leaf2:M.leaf);c.position.y=1.9+i*.56;c.castShadow=true;g.add(c)}g.position.set(x,0,z);scene.add(g);trees.push({g,x,z,hp:3,regrow:0,active:true})}
function build(){let floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),M.grass);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);box(5,.06,26,material('#9a8055'),0,.03,-7);box(17,.08,11,material('#8a7652'),0,.04,-20);
box(8,.3,6,M.dark,0,.18,-21);box(8,.35,6,M.roof,0,3.05,-21);box(.35,3,6,M.bark,-4,1.55,-21);box(.35,3,6,M.bark,4,1.55,-21);box(2,.35,5,M.metal,0,.55,-15);for(let i=0;i<6;i++)cylinder(.15,.15,.12,M.dark,-.7+i*.28,.82,-15,12).rotation.z=Math.PI/2;
box(5,2.5,4,material('#a87842'),9,1.25,-20);box(5,.25,4,M.roof,9,2.65,-20);box(3,.4,2,M.plank,12,.25,-14);
for(let x=-15;x<=15;x+=5)for(let z=-4;z<=14;z+=5){if(Math.abs(x)<5&&z>0)continue;tree(x,z)}
}
function makePlayer(){player=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.32,.6,4,8),M.shirt);body.position.y=.8;player.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.23,12,10),M.skin);head.position.y=1.4;player.add(head);let legs=new THREE.Mesh(new THREE.BoxGeometry(.4,.5,.3),M.dark);legs.position.y=.25;player.add(legs);scene.add(player);player.position.set(0,0,5)}
function nearest(){let best=null,dmin=2.8;for(const t of trees)if(t.active){let d=Math.hypot(player.position.x-t.x,player.position.z-t.z);if(d<dmin){best=t;dmin=d}}return best}
function chop(){let t=nearest();if(!t){toast('Acércate a un árbol');return}if(s.logs>=s.capacity){toast('Mochila llena. Entrega los troncos');return}t.hp-=s.axe;if(t.hp<=0){t.active=false;t.regrow=40;scene.remove(t.g);s.logs++;toast('+1 tronco');ui();save()}else toast('¡Toc! Sigue talando')}
function deliver(){if(s.logs===0){toast('No llevas troncos');return}if(Math.hypot(player.position.x,player.position.z+15)>5){toast('Acércate a la banda del aserradero');return}let count=s.logs;s.logs=0;for(let i=0;i<count;i++)production.push({time:5+i*1.4});toast(count+' troncos en producción');ui();save()}
function sell(){if(Math.hypot(player.position.x-12,player.position.z+14)>4){toast('Acércate al puesto de venta');return}if(!s.planks){toast('Todavía no hay tablas listas');return}let amount=s.planks,earned=amount*s.plankPrice;s.planks=0;s.cash+=earned;toast('¡Venta realizada! +$'+earned);ui();save()}
const upgradeData=[['axe','🪓 Hacha reforzada','Más golpes de tala por acción',80],['capacity','🎒 Mochila grande','Aumenta capacidad en 3 troncos',100],['value','✨ Madera seleccionada','Cada tabla vale $5 más',150],['worker','🧑‍🌾 Contratar leñador','Trae troncos automáticamente',250]];
function shop(){ $('items').replaceChildren();for(const [id,name,desc,base] of upgradeData){let level=s.levels[id]||0,cost=Math.floor(base*Math.pow(1.65,level)),row=document.createElement('div');row.className='item';let info=document.createElement('div'),title=document.createElement('b'),small=document.createElement('small'),btn=document.createElement('button');title.textContent=name;small.textContent=desc+' · Nivel '+level;info.append(title,small);btn.textContent='Comprar $'+cost;btn.onclick=()=>{if(s.cash<cost){toast('Te falta dinero');return}s.cash-=cost;s.levels[id]=level+1;if(id==='axe')s.axe++;if(id==='capacity')s.capacity+=3;if(id==='value')s.plankPrice+=5;if(id==='worker'){s.crew++;addWorker()}shop();ui();save();toast('¡Mejora comprada!')};row.append(info,btn);$('items').append(row)}}
function addWorker(){let w=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(.4,.75,.35),M.shirt),h=new THREE.Mesh(new THREE.SphereGeometry(.19,8,8),M.skin);b.position.y=.5;h.position.y=1;w.add(b,h);w.position.set(-2+workerObjects.length,0,4);scene.add(w);workerObjects.push(w)}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color('#9bc6d4');scene.fog=new THREE.Fog('#9bc6d4',30,78);camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);camera.position.set(0,10,16);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('world').append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe8f6ff,0x46633b,1.8));let sun=new THREE.DirectionalLight(0xfff0d2,2);sun.position.set(-12,22,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);clock=new THREE.Clock();build();makePlayer();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate()}
let autoClock=0;
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05),dx=stickMove.x+(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dz=stickMove.z+(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0),len=Math.hypot(dx,dz);if(len>.05){player.position.x+=dx/len*5*dt;player.position.z+=dz/len*5*dt;player.rotation.y=Math.atan2(dx,dz)}player.position.x=THREE.MathUtils.clamp(player.position.x,-22,22);player.position.z=THREE.MathUtils.clamp(player.position.z,-25,17);camera.position.x+=(player.position.x-camera.position.x)*.08;camera.position.z+=(player.position.z+11-camera.position.z)*.08;camera.lookAt(player.position.x,0,player.position.z-5);
if(holding&&(chopClock-=dt)<=0){chop();chopClock=.75}for(let t of trees)if(!t.active&&(t.regrow-=dt)<=0){t.active=true;t.hp=3;scene.add(t.g)}
for(let p of production)p.time-=dt;let ready=production.filter(p=>p.time<=0).length;if(ready){s.planks+=ready*2;production=production.filter(p=>p.time>0);ui();save();toast('¡Tablas listas! +'+ready*2)}
autoClock+=dt;if(s.crew&&autoClock>=8){autoClock=0;if(s.logs<s.capacity){s.logs++;ui();save();toast('Tus leñadores trajeron un tronco')}}
workerObjects.forEach((w,i)=>{w.position.x=-2+Math.sin(performance.now()*.0005+i)*1.5;w.position.z=3+Math.cos(performance.now()*.0005+i)*1.2});renderer.render(scene,camera)}
$('chop').addEventListener('pointerdown',e=>{holding=true;chopClock=0});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('chop').addEventListener(ev,()=>holding=false));$('deliver').onclick=deliver;$('sell').onclick=sell;$('shopOpen').onclick=()=>{$('modal').classList.add('show');shop()};$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='e')deliver();if(e.key==='f')sell()});addEventListener('keyup',e=>keys[e.key]=false);
let zone=$('stickzone'),stick=$('stick'),pid=null;function setStick(e){let r=zone.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.min(36,Math.hypot(x,y)),a=Math.atan2(y,x);stick.style.left=37+Math.cos(a)*d+'px';stick.style.top=37+Math.sin(a)*d+'px';stickMove={x:Math.cos(a)*Math.min(1,Math.hypot(x,y)/25),z:Math.sin(a)*Math.min(1,Math.hypot(x,y)/25)}}function reset(){pid=null;stickMove={x:0,z:0};stick.style.left='35px';stick.style.top='35px'}zone.addEventListener('pointerdown',e=>{pid=e.pointerId;zone.setPointerCapture(pid);setStick(e)});zone.addEventListener('pointermove',e=>{if(e.pointerId===pid)setStick(e)});zone.addEventListener('pointerup',reset);zone.addEventListener('pointercancel',reset);
init();ui();save();toast('¡Bienvenido! Tu imperio comienza hoy.');addEventListener('beforeunload',save);
})();
</script></body></html>
