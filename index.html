<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#173923"><title>Imperio Maderero 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bc6d4;color:#fff;font-family:system-ui,Arial;touch-action:none}#world{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:10px;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px}.brand,.stat,.bar{background:#10251bea;border:1px solid #ffffff30;border-radius:13px;padding:8px 11px;box-shadow:0 4px 16px #0004}.brand b{display:block;color:#ffd166}.stats{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.stat{text-align:center;min-width:52px}.stat b{display:block;color:#ffd166;font-size:14px}.stat small{font-size:9px}.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;pointer-events:auto}.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.help{font-size:10px;line-height:1.3;max-width:190px}button{border:0;border-radius:10px;padding:11px;background:#ffd166;color:#34270c;font-weight:800;font-size:11px}button.alt{background:#315c3d;color:white}button:disabled{opacity:.4}#stickzone{position:fixed;left:16px;bottom:88px;width:112px;height:112px;border-radius:50%;background:#ffffff25;border:2px solid #ffffff60;display:none;touch-action:none}#stick{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#ffd166}#toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:#10251bf2;border:1px solid #ffffff40;border-radius:12px;padding:10px 15px;z-index:8;opacity:0;pointer-events:none;text-align:center}#modal{display:none;position:fixed;inset:0;background:#000a;z-index:9;align-items:center;justify-content:center;padding:14px;pointer-events:auto}#modal.show{display:flex}.panel{width:min(540px,100%);max-height:88vh;overflow:auto;background:#14291f;border:1px solid #ffffff40;border-radius:18px;padding:17px}.panel h2{margin:0;color:#ffd166}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #ffffff20}.item small{display:block;opacity:.7}@media(max-width:650px){#stickzone{display:block}.brand{font-size:11px}.stat{min-width:44px;padding:5px}.stat b{font-size:12px}.stat small{font-size:8px}.bottom{align-items:flex-end}.help{max-width:105px;font-size:9px}.bar{gap:4px;padding:6px}.bar button{padding:9px 7px;font-size:9px}}
</style></head><body>
<div id="world"></div><div class="hud"><div class="top"><div class="brand"><b>🌲 IMPERIO MADERERO</b><small>Construye · Produce · Expande</small></div><div class="stats"><div class="stat"><b id="cash">$0</b><small>DINERO</small></div><div class="stat"><b id="logs">0/5</b><small>TRONCOS</small></div><div class="stat"><b id="planks">0</b><small>TABLAS</small></div><div class="stat"><b id="crew">0</b><small>PERSONAL</small></div><div class="stat"><b id="level">1</b><small>NIVEL</small></div></div></div><div class="bottom"><div class="bar"><div class="help">Joystick o WASD. Acércate a los árboles, tala, carga el camión, procesa y vende.</div></div><div class="bar"><button id="chop">🪓 TALAR</button><button class="alt" id="deliver">🚚 CARGAR</button><button class="alt" id="sell">💰 VENDER</button><button class="alt" id="shopOpen">🏗️ MEJORAS</button></div></div></div><div id="stickzone"><div id="stick"></div></div><div id="toast"></div><div id="modal"><div class="panel"><h2>🏗️ Tu imperio</h2><p>Invierte tus ganancias para aumentar la producción.</p><div id="items"></div><button class="alt" id="close" style="width:100%;margin-top:12px">CERRAR</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),SAVE='imperio_maderero_save_v2',base={cash:0,logs:0,capacity:5,planks:0,crew:0,axe:1,price:12,level:1,up:{capacity:0,axe:0,price:0,crew:0,land:0}};
let s;try{let v=JSON.parse(localStorage.getItem(SAVE)||'null');s={...base,...(v||{})};s.up={...base.up,...(v?.up||{})}}catch{s={...base,up:{...base.up}}}
let scene,camera,renderer,clock,player,trees=[],keys={},move={x:0,z:0},hold=false,chopTimer=0,autoTimer=0,truck,truckJob=null,buyer=null,buyerJob=null,workers=[],production=[],logsOnTruck=[],toastTimer;
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9}),M={grass:mat('#54864b'),bark:mat('#765039'),leaf:mat('#347b43'),leaf2:mat('#55964c'),wood:mat('#c38a4b'),metal:mat('#65727a'),dark:mat('#283239'),roof:mat('#9b563b'),wall:mat('#d6bd8a'),gold:mat('#e7b84e'),blue:mat('#347c9e'),glass:mat('#8fc8d8')};
function addBox(w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
function addCyl(a,b,h,m,x,y,z,n=9){let o=new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,n),m);o.position.set(x,y,z);scene.add(o);return o}
function makeTree(x,z){let g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,1.8,7),M.bark),a=new THREE.Mesh(new THREE.ConeGeometry(1.05,2.2,8),M.leaf),b=new THREE.Mesh(new THREE.ConeGeometry(.78,1.7,8),M.leaf2);tr.position.y=.9;a.position.y=2.5;b.position.y=3.35;g.add(tr,a,b);g.position.set(x,0,z);scene.add(g);trees.push({g,x,z,hp:3,active:true,regrow:0})}
function makeTruck(color,x,z){let g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(2,.65,3.5),mat(color)),cab=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.1,1.3),M.gold),glass=new THREE.Mesh(new THREE.BoxGeometry(1.45,.55,.05),M.glass);b.position.y=.85;cab.position.set(0,1.55,1.05);glass.position.set(0,1.72,1.72);g.add(b,cab,glass);for(let xx of [-1,1])for(let zz of [-1.1,1.1]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.22,12),M.dark);w.rotation.z=Math.PI/2;w.position.set(xx,.38,zz);g.add(w)}g.position.set(x,0,z);scene.add(g);return g}
function setup(){scene=new THREE.Scene();scene.background=new THREE.Color('#9bc6d4');scene.fog=new THREE.Fog('#9bc6d4',38,95);camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,140);camera.position.set(0,18,25);renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;$('world').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x58714b,2));let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-12,25,15);scene.add(sun);addBox(90,.3,90,M.grass,0,-.2,-8);addBox(7,.06,43,mat('#9b927b'),11,0,-7);addBox(26,.07,7,mat('#9b927b'),0,.01,-15);
addBox(8,3.4,6,M.wall,-2,1.7,-17);addBox(8.4,.35,6.4,M.roof,-2,3.55,-17);addBox(7,3,5,M.wall,11,1.5,-25);addBox(7.3,.35,5.3,M.blue,11,3.15,-25);addCyl(.42,.48,5,M.metal,-5,2.5,-19,12);addBox(5,.7,2,M.metal,2,.7,-16);addBox(5,.16,.35,M.dark,2,1.13,-16);for(let i=0;i<9;i++){let r=addCyl(.12,.12,2.7,M.dark,-.5+i*.6,.8,-16,10);r.rotation.z=Math.PI/2}addBox(5,.2,4,M.wood,11,.15,-18);
for(let i=0;i<15;i++)makeTree(-17+(i%5)*4.2,2-Math.floor(i/5)*7);for(let i=0;i<7;i++)makeTree(17+(i%3)*3,1-Math.floor(i/3)*8);
player=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.8,3,7),mat('#315c9b')),head=new THREE.Mesh(new THREE.SphereGeometry(.32,9,8),mat('#d6a77c')),hat=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.12,10),M.gold);body.position.y=1;head.position.y=1.72;hat.position.y=2.03;player.add(body,head,hat);scene.add(player);player.position.set(0,0,5);truck=makeTruck('#bd5137',-18,-8);for(let i=0;i<s.crew;i++)addWorker();addEventListener('resize',resize)}
function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.2))}
function addWorker(){let g=new THREE.Group(),b=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.5,2,6),M.gold),h=new THREE.Mesh(new THREE.SphereGeometry(.2,8,8),mat('#c99670'));b.position.y=.65;h.position.y=1.18;g.add(b,h);scene.add(g);workers.push(g)}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(s))}catch{}}
function ui(){$('cash').textContent='$'+Math.floor(s.cash).toLocaleString('es-MX');$('logs').textContent=s.logs+'/'+s.capacity;$('planks').textContent=s.planks;$('crew').textContent=s.crew;$('level').textContent=s.level}
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.opacity=0,2200)}
function nearest(){let best=null,d=99;for(let t of trees)if(t.active){let q=Math.hypot(player.position.x-t.x,player.position.z-t.z);if(q<d){d=q;best=t}}return d<3.2?best:null}
function chop(){let t=nearest();if(!t){toast('Acércate a un árbol para talar');return}if(s.logs>=s.capacity){toast('Mochila llena. Lleva troncos al camión');return}t.hp--;if(t.hp<=0){t.active=false;t.regrow=24;scene.remove(t.g);s.logs++;ui();save();toast('🪵 Tronco recogido')}else toast('¡TAC! Quedan '+t.hp+' golpes')}
function deliver(){if(!s.logs){toast('No llevas troncos');return}if(Math.hypot(player.position.x+18,player.position.z+8)>7){toast('Acércate al camión en el patio');return}if(truckJob){toast('El camión está trabajando');return}truckJob={t:0,n:s.logs,phase:0};s.logs=0;ui();save();toast('🚚 Camión cargando troncos')}
function sell(){if(!s.planks){toast('No hay tablas listas');return}if(Math.hypot(player.position.x-11,player.position.z+25)>7){toast('Acércate al almacén de ventas');return}if(buyerJob){toast('El comprador está cargando');return}buyerJob={t:0,n:s.planks,phase:0};s.planks=0;ui();save();toast('🚛 Comprador llegó por las tablas')}
const labels={capacity:'Mochila +3 troncos',axe:'Hacha más rápida',price:'Mejor precio por tabla',crew:'Contratar leñador',land:'Desbloquear bosque'};
function cost(k){return Math.floor(({capacity:75,axe:90,price:130,crew:250,land:700}[k])*Math.pow(({capacity:1.55,axe:1.65,price:1.8,crew:1.9,land:2.4}[k]),s.up[k]))}
function shop(){let o='';for(let k in labels){let c=cost(k);o+='<div class="item"><div><b>'+labels[k]+'</b><small>Nivel '+s.up[k]+'</small></div><button data-k="'+k+'" '+(s.cash<c?'disabled':'')+'>$'+c+'</button></div>'}$('items').innerHTML=o;$('items').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>buy(b.dataset.k))}
function buy(k){let c=cost(k);if(s.cash<c)return;s.cash-=c;s.up[k]++;if(k==='capacity')s.capacity+=3;if(k==='axe')s.axe++;if(k==='price')s.price+=4;if(k==='crew'){s.crew++;addWorker()}if(k==='land'){s.level++;for(let i=0;i<9;i++)makeTree(25+(i%3)*3,2-Math.floor(i/3)*6)}ui();save();shop();toast('Mejora comprada')}
function updateTruck(dt){if(!truckJob)return;let j=truckJob;j.t+=dt;if(j.phase===0&&j.t>1){for(let i=0;i<j.n;i++){let l=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,1.15,8),M.wood);l.rotation.z=Math.PI/2;l.position.set((i%3-.9)*.38,1.55,-.7-Math.floor(i/3)*.35);truck.add(l);logsOnTruck.push(l)}j.phase=1;j.t=0}else if(j.phase===1){truck.position.x=-18+Math.min(1,j.t/4)*28;if(j.t>4){for(let l of logsOnTruck)truck.remove(l);logsOnTruck=[];for(let i=0;i<j.n;i++)production.push({time:5+i*2});truck.position.set(-18,0,-8);truckJob=null;toast('🏭 Troncos descargados. Producción iniciada')}}}
function updateBuyer(dt){if(!buyerJob)return;let j=buyerJob;j.t+=dt;if(j.phase===0){if(!buyer)buyer=makeTruck('#367d9c',11,-32);buyer.position.z=-32+Math.min(1,j.t/2)*7;if(j.t>2){j.phase=1;j.t=0}}else if(j.t>2){s.cash+=j.n*s.price*2;scene.remove(buyer);buyer=null;buyerJob=null;ui();save();toast('💰 Venta completada: +$'+(j.n*s.price*2))}}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05),dx=move.x+(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dz=move.z+(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0),l=Math.hypot(dx,dz);if(l>.08){player.position.x+=dx/l*5.2*dt;player.position.z+=dz/l*5.2*dt;player.rotation.y=Math.atan2(dx,dz)}player.position.x=THREE.MathUtils.clamp(player.position.x,-28,29);player.position.z=THREE.MathUtils.clamp(player.position.z,-34,18);camera.position.x+=(player.position.x-camera.position.x)*.06;camera.position.z+=(player.position.z+15-camera.position.z)*.06;camera.lookAt(player.position.x,0,player.position.z-5);if(hold&&(chopTimer-=dt)<=0){chop();chopTimer=Math.max(.35,1.05-(s.axe-1)*.12)}updateTruck(dt);updateBuyer(dt);for(let t of trees)if(!t.active&&(t.regrow-=dt)<=0){t.active=true;t.hp=3;scene.add(t.g)}for(let p of production)p.time-=dt;let done=production.filter(p=>p.time<=0).length;if(done){s.planks+=done*2;production=production.filter(p=>p.time>0);ui();save();toast('🏭 ¡Tablas listas! +'+done*2)}autoTimer+=dt;if(s.crew&&autoTimer>=7){autoTimer=0;if(s.logs<s.capacity){s.logs++;ui();save()}}workers.forEach((w,i)=>{w.position.x=-3+Math.sin(performance.now()*.0004+i*2)*1.5;w.position.z=2+Math.cos(performance.now()*.0004+i*2)*1.5});renderer.render(scene,camera)}
function inputs(){$('chop').addEventListener('pointerdown',e=>{e.preventDefault();hold=true;chopTimer=0});['pointerup','pointercancel','pointerleave'].forEach(v=>$('chop').addEventListener(v,()=>hold=false));$('deliver').onclick=deliver;$('sell').onclick=sell;$('shopOpen').onclick=()=>{$('modal').classList.add('show');shop()};$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='e')deliver();if(e.key==='f')sell()});addEventListener('keyup',e=>keys[e.key]=false);let z=$('stickzone'),st=$('stick'),pid=null;function set(e){let r=z.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.min(35,Math.hypot(x,y)),a=Math.atan2(y,x);st.style.left=35+Math.cos(a)*d+'px';st.style.top=35+Math.sin(a)*d+'px';move={x:Math.cos(a)*Math.min(1,Math.hypot(x,y)/25),z:Math.sin(a)*Math.min(1,Math.hypot(x,y)/25)}}function reset(){pid=null;move={x:0,z:0};st.style.left='34px';st.style.top='34px'}z.addEventListener('pointerdown',e=>{pid=e.pointerId;z.setPointerCapture(pid);set(e)});z.addEventListener('pointermove',e=>{if(e.pointerId===pid)set(e)});z.addEventListener('pointerup',reset);z.addEventListener('pointercancel',reset)}
try{setup();clock=new THREE.Clock();inputs();ui();animate();toast('¡Bienvenido! Tu aserradero está listo.')}catch(e){console.error(e);toast('Error al iniciar 3D. Recarga la página.')}addEventListener('beforeunload',save);
})();
</script></body></html>
